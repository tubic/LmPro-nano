model:
  encoder:
    node_feat_dim: 128
    pair_feat_dim: 64
    num_layers: 6
  flow:
    num_blocks: 8
    num_hidden_dims: 128
    num_spline_bins: 64

data:
  train:
    type: pdbredo_chain
    split: train
    pdbredo_dir: ./data/PDB_REDO
    clusters_path: ./data/generated/pdbredo_skempi50_disjoint/pdbredo_clusters.txt
    splits_path: ./data/generated/pdbredo_skempi50_disjoint/pdbredo_splits.txt
    processed_dir: /tmp/af3_bosun_rde_cache_skempi50_disjoint
    transform:
      - type: select_atom
        resolution: backbone+CB
      - type: focused_random_patch
        focus_attr: focus_flag
        seed_nbh_size: 32
        patch_size: 128
      - type: corrupt_chi_angle
        ratio_mask: 0.1
        maskable_flag_attr: focus_flag
  val:
    type: pdbredo_chain
    split: val
    pdbredo_dir: ./data/PDB_REDO
    clusters_path: ./data/generated/pdbredo_skempi50_disjoint/pdbredo_clusters.txt
    splits_path: ./data/generated/pdbredo_skempi50_disjoint/pdbredo_splits.txt
    processed_dir: /tmp/af3_bosun_rde_cache_skempi50_disjoint
    transform:
      - type: select_atom
        resolution: backbone+CB
      - type: focused_random_patch
        focus_attr: focus_flag
        seed_nbh_size: 32
        patch_size: 128
      - type: corrupt_chi_angle
        ratio_mask: 0.1
        maskable_flag_attr: focus_flag

train:
  loss_weights:
    mle_1chis: 0.25
    mle_2chis: 0.25
    mle_3chis: 0.25
    mle_4chis: 0.25
  max_iters: 200_000
  val_freq: 1000
  batch_size: 64
  accumulation_steps: 1
  seed: 2022
  max_grad_norm: 100.0
  optimizer:
    type: adam
    lr: 1.e-4
    weight_decay: 0.0
    beta1: 0.9
    beta2: 0.999
  scheduler:
    type: plateau
    factor: 0.8
    patience: 5
    min_lr: 1.e-6
