# rde_ddg_skempi_new.yml (适配重构架构版)
model:
  rde_checkpoint: ./outputs/strengthened_rde_runs/run_20250902_122816/best_model.pt
  
  # 保持与预训练 EnhancedRDE 一致的架构参数
  n_heads: 16
  ipa:
    heads: 8
  backbone_dim: 256 # EnhancedRDE 输出的特征维度
  # none 保留旧实验；native/mask_mut 用于检验与预训练 χ 输入分布对齐的迁移方式。
  backbone_chi_mode: none

  # [新增] 为我们自己的、可训练的编码器提供配置
  encoder:
    node_feat_dim: 256
    pair_feat_dim: 64
    num_layers: 3      # <--- [核心修正] 名称改为 num_layers (复数)
    pair_atoms: 5      # [性能] ResiduePairEncoder 用的重原子数(5=backbone+CB)；15 为全重原子但慢约9倍
    ga_block_opt:      # <--- [核心修正] 新增嵌套结构
      num_heads: 4     # <--- [核心修正] 名称改为 num_heads，并放入子结构中

  # [性能] 突变 patch 池化：patch = 突变残基 ∪ CA 距突变残基 <= radius Å 的邻居（min_k 兜底）
  # 仅在 head.rich=false 的对照设置下使用
  pool:
    radius: 10.0
    min_k: 16

  # [性能] 预测头：多尺度池化(global/local/env) + WT/MT/差值 读出；
  # 混合损失 alpha*MSE + (1-alpha)*(1-Pearson)。Pearson 项要求 batch_size > 1 才有效。
  head:
    rich: true
    readout_dim: 512
    loss_alpha: 0.2
    env_radius: 10.0

dataset:
  # ... (保持不变)
  csv_path: ./data/SKEMPI_v2/skempi_v2.csv
  pdb_dir: ./data/SKEMPI_v2/PDBs
  cache_dir: ./data/SKEMPI_v2_cache_parsed
  processed_dir: ./data/SKEMPI_v2_features
  num_cvfolds: 5
  cvfold_index: 3
  split_seed: 2022

training:
  # ... (保持不变，但建议重新从一个较高的学习率开始探索)
  output_dir: ./outputs/finetune_ddg_refactored_model
  max_seq_len: 900
  num_epochs: 100
  batch_size: 1
  accumulation_steps: 16
  num_workers: 4
  seed: 2022
  warmup_steps: 150
  optimizer:
    type: adamw
    # [先验设定] head_lr 取 1e-4，与本仓库既有 ddG 微调配置一致
    # (rde_ddg_skempi.yml / _ori.yml / _wenzhang.yml 均为 1e-4；_wenzhang 同为"冻结骨干+可训练头")，
    # 亦符合冻结骨干微调的标准实践。该取值在任何交叉验证指标之前确定，不依据 CV 结果调整。
    head_lr: 1.0e-4   # 为所有新的可训练参数设置统一的学习率
    backbone_lr: 0.0  # 预训练骨干将完全冻结
    weight_decay: 0.01
  max_grad_norm: 1.0
  scheduler:
    factor: 0.8
    patience: 5
    min_lr: 1.0e-06
